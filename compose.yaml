services:
  signalwatch:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - SIGNALWATCH_API_TOKEN
      - SIGNALWATCH_CORS_ORIGINS
      - SIGNALWATCH_PROXY_LIST_JSON
      - SIGNALWATCH_PROXY_LIST_FILE
      - SIGNALWATCH_PROXY_USERNAME
      - SIGNALWATCH_PROXY_PASSWORD
      - SIGNALWATCH_PROXY_DIRECT_HOSTS
      - SIGNALWATCH_STARTUP_SOURCES
    volumes:
      - ./data:/data
    restart: unless-stopped
