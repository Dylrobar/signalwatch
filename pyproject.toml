[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalwatch"
version = "0.9.3"
description = "Public infrastructure and vulnerability intelligence monitor"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "feedparser>=6.0,<7", "beautifulsoup4>=4.12,<5", "ijson>=3.3,<4", "packaging>=24,<27", "pypdf>=5,<7"]

[project.scripts]
signalwatch = "signalwatch.cli:main"

[tool.setuptools.packages.find]
include = ["signalwatch*"]

[tool.setuptools.package-data]
signalwatch = ["static/*"]
