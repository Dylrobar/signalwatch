# Bind the web entry to the existing SignalWatch service and its existing disk.
# Do not create a second web service: raw wireless archives remain on /data.
# PostgreSQL credentials and the verified migration flag are managed in the
# existing service's environment; see docs/recovery.md before a cutover.
services:
  - type: web
    name: signalwatch
    runtime: docker
    repo: https://github.com/Dylrobar/signalwatch
    branch: main
    region: virginia
    # Keep the existing web instance plan (currently 1c-2g); do not resize it.
    healthCheckPath: /health
    disk:
      name: signalwatch-data
      mountPath: /data
      sizeGB: 50
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SIGNALWATCH_CONFIG
        value: /data/config.json
      - key: SIGNALWATCH_CELERY_BEAT
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: signalwatch-queue
          property: connectionString
  - type: keyvalue
    name: signalwatch-queue
    region: virginia
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
